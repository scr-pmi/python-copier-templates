_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: Project name (for example, sales-analysis)

module_name:
  type: str
  help: Importable Python package name
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') }}"

project_description:
  type: str
  help: Short project description
  default: ""

python_version:
  type: str
  help: Minimum Python version
  default: "3.12"

_tasks:
  - command: git init
    when: "{{ _copier_operation == 'copy' }}"
  - command: uv sync
    when: "{{ _copier_operation == 'copy' }}"
  - command: uv run prek install
    when: "{{ _copier_operation == 'copy' }}"
  - command: uv run prek run --all-files
    when: "{{ _copier_operation == 'copy' }}"
